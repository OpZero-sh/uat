name: Oz Channels e2e

# Browser and call suite for Oz Channels. See suites/oz-channels/README.md.
# No stored secret: the harness accepts this job's GitHub OIDC token.

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      calls:
        description: 'Run the call checks (counts against call caps)'
        type: boolean
        default: false
      notetaker:
        description: 'Also wait for the notetaker transcript'
        type: boolean
        default: false
  repository_dispatch:
    types: [oz-channels-deploy]

permissions:
  contents: read
  id-token: write

concurrency:
  group: oz-channels-e2e
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-24.04  # Playwright 1.50 has no build for ubuntu 26.04 (ubuntu-latest)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and espeak-ng
        working-directory: suites/oz-channels
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.50.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y espeak-ng sox >/dev/null
      - name: Make the fake microphone audio
        working-directory: suites/oz-channels
        run: |
          espeak-ng -s 140 -w speech.wav "harness check. this is the oz channels end to end test. harness check."
          sox -n -r 48000 -c 1 tone.wav synth 30 sine 440 vol 0.5
      - name: Run
        working-directory: suites/oz-channels
        env:
          OZ_CALLS: ${{ (github.event.inputs.calls == 'true' || vars.OZ_CALLS_ENABLED == '1') && '1' || '0' }}
          OZ_NOTETAKER: ${{ (github.event.inputs.notetaker == 'true' || vars.OZ_NOTETAKER_ENABLED == '1') && '1' || '0' }}
          OZ_SPEECH_WAV: ${{ github.workspace }}/suites/oz-channels/speech.wav
          OZ_TONE_WAV: ${{ github.workspace }}/suites/oz-channels/tone.wav
          OZ_SELECTORS: ${{ vars.OZ_SELECTORS }}
        run: node run.mjs
